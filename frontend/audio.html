<!DOCTYPE html>
<html>
<head>
  <title>StudyCast</title>
  <style>
    body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #111827, #050814);
    color: white;
    overflow: hidden;
    }

    /* subtle animated glow background */
    body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: rgba(59,130,246,0.25);
    filter: blur(120px);
    top: -100px;
    left: -100px;
    z-index: 0;
    }

    .app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    }

    /* LEFT PANEL */
    .left {
    padding: 40px;
    background: rgba(255,255,255,0.03);
    border-right: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    }

    .left h2 {
    font-size: 22px;
    margin-bottom: 20px;
    }

    /* TEXTAREA */
    textarea {
    width: 100%;
    height: 220px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 14px;
    font-size: 14px;
    background: rgba(0,0,0,0.3);
    color: white;
    outline: none;
    transition: 0.2s;
    }

    textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 20px rgba(59,130,246,0.3);
    }

    /* BUTTON */
    button {
    margin-top: 12px;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    transform: translateY(0);
    }

    button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(59,130,246,0.3);
    }

    /* STATUS TEXT */
    #status {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.6;
    }

    .right {
    padding: 40px;
    background: rgba(0,0,0,0.2);

    display: flex;
    flex-direction: column;
    height: 100vh;   /* IMPORTANT */
    box-sizing: border-box;
    }

    #output {
    margin-top: 15px;
    padding: 18px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);

    flex: 1;              /* takes remaining space */
    overflow-y: auto;     /* enables scroll */
    line-height: 1.6;
    white-space: pre-wrap;
    }

    .right h2 {
    font-size: 22px;
    }

    /* CONTROLS */
    .controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    }

    .controls button {
    width: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    }

    .controls button:hover {
    background: rgba(59,130,246,0.2);
    }
  </style>
</head>

<body>
    <div class="app">
      <!-- LEFT: INPUT -->
      <div class="left">
        <h2>🧠 Study Input</h2>
        <textarea id="notesEnter" placeholder="Paste your notes here..."></textarea>
        <button id="convert">Generate Lesson</button>
        <p id="status"></p>
      </div>
      <!-- RIGHT: OUTPUT -->
      <div class="right">
        <h2>🎧 AI Lesson</h2>
        <div id="output">Your generated lesson will appear here...</div>
        <div class="controls">
          <button id="play">▶ Play</button>
          <button id="stop">⏹ Stop</button>
        </div>
      </div>
    </div>
    <script src="audio.js"></script>
  </body>
</html>
